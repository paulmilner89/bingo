<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo Board</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #131313;
    --off-bg: #181818;
    --off-border: #2a2a2a;
    --off-text: #3a3a3a;
    --on: #ffb000;
    --on-soft: rgba(255, 176, 0, 0.18);
    --on-dim: #4a3300;
    --white: #f2f2f2;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: calc(100vh * 16 / 9);
    max-height: calc(100vw * 9 / 16);
    container-type: size;
    background: var(--bg);
    overflow: hidden;
  }

  .app {
    height: 100%;
    width: 100%;
    display: grid;
    grid-template-columns: 24fr 76fr;
    gap: 0.8cqw;
    padding: 0.8cqw;
  }

  .left {
    display: flex;
    flex-direction: column;
    gap: 0.8cqw;
    min-width: 0;
    min-height: 0;
  }

  .display {
    flex: 1;
    min-height: 0;
    background: var(--panel);
    border: 2px solid var(--off-border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .display.mixer { padding: 0; }
  .display.mixer canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Reveal canvas overlays the top display and animates the ball rise + spin. */
  #revealCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    z-index: 2;
  }

  .ball {
    font-size: min(20cqh, 11cqw);
    font-weight: 900;
    color: var(--on);
    letter-spacing: -0.05em;
    text-shadow: none;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    will-change: transform, opacity;
    position: relative;
    z-index: 1;
  }

  .ball.empty {
    color: var(--off-text);
    text-shadow: none;
  }

  .ball.hidden {
    opacity: 0;
    transform: scale(0.35);
    transition: opacity 0.3s ease-in, transform 0.3s ease-in;
  }

  .ball.revealing {
    animation: ballReveal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes ballReveal {
    0%   { opacity: 0; transform: scale(0.65); }
    55%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  .controls {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 0.6cqw;
  }

  button {
    font-family: inherit;
    font-size: min(2.6cqh, 1.7cqw);
    font-weight: 800;
    padding: min(2.6cqh, 1.5cqw) 0.6cqw;
    border: 2px solid var(--off-border);
    background: var(--panel);
    color: var(--white);
    border-radius: 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    transition: transform 0.1s ease, filter 0.15s ease, opacity 0.15s ease;
  }

  button.primary {
    background: var(--on);
    color: #000;
    border-color: var(--on);
    box-shadow: 0 0 0 1px rgba(255, 176, 0, 0.2), 0 0 24px rgba(255, 176, 0, 0.2);
  }

  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Vertical callboard: BINGO across the top, 15 numbers stacked per column. */
  .board {
    background: var(--panel);
    border: 2px solid var(--off-border);
    border-radius: 16px;
    padding: 0.75cqw;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: minmax(0, 9%) repeat(15, minmax(0, 1fr));
    grid-auto-flow: column;
    gap: 0.4cqw;
    min-width: 0;
    min-height: 0;
  }

  .letter, .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .letter {
    font-size: min(7cqh, 5cqw);
    color: var(--on);
    background: rgba(255, 176, 0, 0.06);
    border: 2px solid var(--on);
    text-shadow: 0 0 14px rgba(255, 176, 0, 0.4);
  }

  .cell {
    font-size: min(4.6cqh, 3.8cqw);
    color: var(--off-text);
    background: var(--off-bg);
    border: 1.5px solid var(--off-border);
    transition: color 0.25s ease, background 0.25s ease, border-color 0.25s ease, text-shadow 0.25s ease;
  }

  .cell.lit {
    color: var(--on);
    background: var(--on-soft);
    border-color: var(--on);
    text-shadow: 0 0 10px rgba(255, 176, 0, 0.55);
  }

  .cell.flashing {
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% {
      color: var(--on);
      background: rgba(255, 176, 0, 0.28);
      border-color: var(--on);
      text-shadow: 0 0 14px rgba(255, 176, 0, 0.9), 0 0 28px rgba(255, 176, 0, 0.45);
    }
    50% {
      color: var(--on-dim);
      background: var(--off-bg);
      border-color: var(--on-dim);
      text-shadow: none;
    }
  }

  .fs-toggle {
    position: fixed;
    top: 0.6rem;
    right: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.85rem;
    border-radius: 10px;
    border: 1.5px solid var(--on);
    background: rgba(0, 0, 0, 0.65);
    color: var(--on);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1;
    cursor: pointer;
    opacity: 0.9;
    transition: opacity 0.25s ease, transform 0.1s ease, filter 0.15s ease;
    z-index: 20;
  }
  .fs-toggle .icon { font-size: 1.1rem; }
  .fs-toggle:hover { filter: brightness(1.15); }
  .fs-toggle:active { transform: translateY(1px); }
  :fullscreen .fs-toggle,
  :-webkit-full-screen .fs-toggle {
    border-color: var(--off-border);
    color: var(--off-text);
    background: transparent;
    opacity: 0.35;
    padding: 0.35rem 0.6rem;
    font-size: 0.75rem;
  }
  :fullscreen .fs-toggle .label,
  :-webkit-full-screen .fs-toggle .label { display: none; }

  .count {
    position: absolute;
    bottom: 0.7cqw;
    right: 0.9cqw;
    color: var(--off-text);
    font-size: 1.1cqh;
    letter-spacing: 0.15em;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  .modal {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    z-index: 30;
  }
  .modal.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: var(--panel);
    border: 2px solid var(--on);
    border-radius: 18px;
    padding: min(4.5cqh, 3.2cqw) min(5cqh, 4cqw);
    max-width: 60cqw;
    text-align: center;
    box-shadow: 0 0 60px rgba(255, 176, 0, 0.25);
    transform: scale(0.96);
    transition: transform 0.18s ease;
  }
  .modal.open .modal-card { transform: scale(1); }

  .modal-card h2 {
    font-size: min(4.5cqh, 3cqw);
    color: var(--on);
    margin-bottom: min(1.5cqh, 1.2cqw);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 900;
    line-height: 1.1;
  }
  .modal-card p {
    font-size: min(2.6cqh, 1.8cqw);
    color: var(--white);
    margin-bottom: min(3cqh, 2.2cqw);
    opacity: 0.85;
    line-height: 1.4;
  }

  .modal-actions {
    display: flex;
    gap: min(1.5cqh, 1.2cqw);
    justify-content: center;
  }
  .modal-actions button {
    font-size: min(2.2cqh, 1.5cqw);
    padding: min(2cqh, 1.4cqw) min(3cqh, 2.2cqw);
    min-width: min(20cqh, 14cqw);
  }
</style>
</head>
<body>
  <button class="fs-toggle" id="fsToggle" title="Toggle Fullscreen (F)">
    <span class="icon">⤢</span><span class="label">Fullscreen</span>
  </button>

  <div class="stage">
    <div class="app">
      <div class="left">
        <div class="display">
          <div id="ball" class="ball empty">--</div>
          <canvas id="revealCanvas"></canvas>
        </div>
        <div class="display mixer">
          <canvas id="mixerCanvas"></canvas>
        </div>
        <div class="controls">
          <button id="pull" class="primary">Pull Ball</button>
          <button id="clear">Clear</button>
        </div>
      </div>
      <div class="board" id="board"></div>
    </div>
    <div class="count"><span id="count">0</span> / 75</div>

    <div class="modal" id="confirmModal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">Clear the Board?</h2>
        <p><span id="confirmCount">0</span> numbers have been called. This cannot be undone.</p>
        <div class="modal-actions">
          <button id="confirmCancel">Cancel</button>
          <button id="confirmOk" class="primary">Clear Board</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const LETTERS = ['B', 'I', 'N', 'G', 'O'];
  const TOTAL = 75;

  const boardEl     = document.getElementById('board');
  const ballEl      = document.getElementById('ball');
  const pullBtn     = document.getElementById('pull');
  const clearBtn    = document.getElementById('clear');
  const countEl     = document.getElementById('count');
  const fsBtn       = document.getElementById('fsToggle');
  const mixerCanvas = document.getElementById('mixerCanvas');
  const revealCanvas = document.getElementById('revealCanvas');
  const modalEl         = document.getElementById('confirmModal');
  const confirmCountEl  = document.getElementById('confirmCount');
  const confirmOkBtn    = document.getElementById('confirmOk');
  const confirmCancelBtn = document.getElementById('confirmCancel');
  let modalOpen = false;

  const cellMap = {};
  const drawn = new Set();
  let flashingNum = null;
  let mixing = false;

  for (let col = 0; col < 5; col++) {
    const letterEl = document.createElement('div');
    letterEl.className = 'letter';
    letterEl.textContent = LETTERS[col];
    boardEl.appendChild(letterEl);
    for (let row = 0; row < 15; row++) {
      const num = col * 15 + row + 1;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = num;
      boardEl.appendChild(cell);
      cellMap[num] = cell;
    }
  }

  const letterFor  = n => LETTERS[Math.floor((n - 1) / 15)];
  const formatBall = n => letterFor(n) + n;

  function remainingNumbers() {
    const out = [];
    for (let i = 1; i <= TOTAL; i++) if (!drawn.has(i)) out.push(i);
    return out;
  }

  function setBall(text, empty = false) {
    ballEl.textContent = text;
    ballEl.classList.toggle('empty', empty);
  }

  function updateCount() { countEl.textContent = drawn.size; }

  // ===== Ball Mixer: gravity-driven bouncing, ball count tracks remaining pool =====
  // Each Pull fades one ball out; Clear pours in the missing balls from above.
  class BallMixer {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.balls = [];
      this.running = false;
      this.w = 0;
      this.h = 0;
      this.baseRadius = 0;
      this.gravity = 0;
      this._resize();
      const ro = new ResizeObserver(() => this._resize());
      ro.observe(canvas);
    }

    _resize() {
      const rect = this.canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const dpr = window.devicePixelRatio || 1;
      this.canvas.width  = Math.round(rect.width  * dpr);
      this.canvas.height = Math.round(rect.height * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.w = rect.width;
      this.h = rect.height;
      const newRadius = Math.min(this.w, this.h) * 0.058;
      const radiusChanged = newRadius !== this.baseRadius;
      this.baseRadius = newRadius;
      this.gravity = this.h * 2.6;
      // Cache one ball sprite; the animation loop blits it per ball instead
      // of allocating a fresh radial gradient every frame.
      this._ballSprite = this._createBallSprite(this.baseRadius);
      if (radiusChanged) {
        for (const b of this.balls) b.r = this.baseRadius;
      }
      this._clampBalls();
    }

    // Pre-render one ball to an offscreen canvas at the current radius.
    // Called once per resize; the sprite is reused for all 75 draws each frame.
    _createBallSprite(r) {
      const pad = Math.max(4, r * 0.15);
      const size = Math.ceil(2 * r + pad * 2);
      const dpr = window.devicePixelRatio || 1;
      const off = document.createElement('canvas');
      off.width  = Math.round(size * dpr);
      off.height = Math.round(size * dpr);
      const sctx = off.getContext('2d');
      sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const cx = size / 2;
      const cy = size / 2;

      const grad = sctx.createRadialGradient(
        cx - r * 0.4, cy - r * 0.4, 0,
        cx,           cy,           r
      );
      grad.addColorStop(0.0, '#ffe598');
      grad.addColorStop(0.45, '#ffb000');
      grad.addColorStop(1.0, '#6a4200');
      sctx.fillStyle = grad;
      sctx.beginPath();
      sctx.arc(cx, cy, r, 0, Math.PI * 2);
      sctx.fill();

      sctx.strokeStyle = '#0a0a0a';
      sctx.lineWidth = Math.max(1.5, r * 0.06);
      sctx.stroke();

      return { canvas: off, size, offset: cx };
    }

    _clampBalls() {
      for (const b of this.balls) {
        b.x = Math.max(b.r, Math.min(this.w - b.r, b.x));
        // Don't clamp y — balls above the canvas (during pour-in) should stay above.
      }
    }

    _launchVy(minH, maxH) {
      const targetHeight = (minH + Math.random() * (maxH - minH)) * this.h;
      return Math.sqrt(2 * this.gravity * targetHeight);
    }

    // Pour `count` fresh balls in from above the canvas. Each spawns at a random
    // y above the top edge with downward velocity, so they enter the visible
    // area at staggered times naturally.
    pourIn(count) {
      if (this.w === 0 || this.h === 0) {
        // Retry once the canvas has known dimensions.
        requestAnimationFrame(() => this.pourIn(count));
        return;
      }
      const r = this.baseRadius;
      const spreadPx = this.h * 1.8;
      for (let i = 0; i < count; i++) {
        this.balls.push({
          x:  r + Math.random() * Math.max(1, this.w - 2 * r),
          y:  -r - Math.random() * spreadPx,
          vx: (Math.random() - 0.5) * this.w * 0.7,
          vy: 150 + Math.random() * 400,
          r,
          opacity: 1,
          fadingOut: false,
          fadeStart: 0,
        });
      }
    }

    // Bring the mixer back to `target` balls, only pouring in the missing ones.
    replenishTo(target) {
      // Only count non-fading balls.
      let alive = 0;
      for (const b of this.balls) if (!b.fadingOut) alive++;
      const needed = target - alive;
      if (needed > 0) this.pourIn(needed);
    }

    // Fade the highest-in-view (smallest y) ball out over 400ms.
    removeBall() {
      if (this.w === 0 || this.h === 0) return;
      // Prefer a ball that is inside the visible area and not already fading.
      let idx = -1;
      let bestY = Infinity;
      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (b.fadingOut) continue;
        if (b.y - b.r > this.h || b.y + b.r < 0) continue;  // off-canvas
        if (b.y < bestY) { bestY = b.y; idx = i; }
      }
      // Fall back to any non-fading ball if all visible ones are fading.
      if (idx === -1) {
        for (let i = 0; i < this.balls.length; i++) {
          if (!this.balls[i].fadingOut) { idx = i; break; }
        }
      }
      if (idx === -1) return;
      this.balls[idx].fadingOut = true;
      this.balls[idx].fadeStart = performance.now();
    }

    liveCount() {
      let n = 0;
      for (const b of this.balls) if (!b.fadingOut) n++;
      return n;
    }

    start() {
      if (this.running) return;
      this.running = true;
      this._lastNow = performance.now();
      if (!this._boundLoop) this._boundLoop = this._loop.bind(this);
      requestAnimationFrame(this._boundLoop);
    }

    stop() { this.running = false; }

    _loop(now) {
      if (!this.running) return;
      const dt = Math.min(1/30, (now - this._lastNow) / 1000);
      this._lastNow = now;
      this._update(dt, now);
      this._draw();
      requestAnimationFrame(this._boundLoop);
    }

    _update(dt, now) {
      const w = this.w, h = this.h, g = this.gravity;
      // Physics
      for (const b of this.balls) {
        b.vy += g * dt;
        b.x  += b.vx * dt;
        b.y  += b.vy * dt;

        if (b.x - b.r < 0)      { b.x = b.r;         b.vx = Math.abs(b.vx) * 0.85; }
        else if (b.x + b.r > w) { b.x = w - b.r;     b.vx = -Math.abs(b.vx) * 0.85; }

        if (b.y + b.r > h) {
          b.y  = h - b.r;
          b.vy = -this._launchVy(0.3, 1.1);
          b.vx = (Math.random() - 0.5) * w * 1.1;
        }
      }
      // Fade out any ball marked for removal; splice when opacity reaches 0.
      for (let i = this.balls.length - 1; i >= 0; i--) {
        const b = this.balls[i];
        if (b.fadingOut) {
          const elapsed = now - b.fadeStart;
          b.opacity = Math.max(0, 1 - elapsed / 400);
          if (b.opacity <= 0) this.balls.splice(i, 1);
        }
      }
    }

    _draw() {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, this.w, this.h);

      // Shadows (only for balls actually in view).
      const floorY = this.h - 1;
      for (const b of this.balls) {
        if (b.y + b.r < 0 || b.y - b.r > this.h) continue;  // off-canvas
        const heightRatio = Math.max(0, Math.min(1, b.y / this.h));
        const scale = 0.45 + 0.55 * heightRatio;
        const alpha = (0.12 + 0.35 * heightRatio) * b.opacity;
        ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
        ctx.beginPath();
        ctx.ellipse(b.x, floorY, b.r * 0.9 * scale, b.r * 0.18 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Back-to-front by y for layered depth. Same-size balls, but stacking
      // still reads as depth because of the overlap. Draw calls are just
      // sprite blits — no gradient allocation, no arc/stroke work per ball.
      const sprite = this._ballSprite;
      if (!sprite) { ctx.globalAlpha = 1; return; }
      const order = this.balls.slice().sort((a, b) => a.y - b.y);
      const off = sprite.offset;
      const size = sprite.size;
      for (const b of order) {
        if (b.y + b.r < 0) continue;  // above canvas, hidden
        ctx.globalAlpha = b.opacity;
        ctx.drawImage(sprite.canvas, b.x - off, b.y - off, size, size);
      }
      ctx.globalAlpha = 1;
    }
  }

  // ===== Reveal panel: rise + grow + spin-flip on the top display's canvas =====
  class RevealPanel {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.w = 0;
      this.h = 0;
      this.centerX = 0;
      this.centerY = 0;
      this.ballRadius = 0;
      this.numberFont = 0;
      this.running = false;
      this.numberText = '';
      this._resize();
      const ro = new ResizeObserver(() => this._resize());
      ro.observe(canvas);
    }

    _resize() {
      const rect = this.canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const dpr = window.devicePixelRatio || 1;
      this.canvas.width  = Math.round(rect.width * dpr);
      this.canvas.height = Math.round(rect.height * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.w = rect.width;
      this.h = rect.height;
      this.centerX = this.w / 2;
      this.centerY = this.h / 2;
      // Ball size fills most of the panel; number size matched to DOM ball font
      // so the canvas-to-DOM handoff cross-fade is visually seamless.
      this.ballRadius = Math.min(this.w, this.h) * 0.42;
      this.numberFont = Math.min(this.h * 0.62, this.w * 0.47);
    }

    play(numberText, onComplete) {
      this._resize();
      this.numberText = numberText;
      this.onComplete = onComplete;
      this.running = true;
      this.startTime = performance.now();
      this.canvas.style.transition = 'none';
      this.canvas.style.opacity = '1';
      if (!this._boundLoop) this._boundLoop = this._loop.bind(this);
      requestAnimationFrame(this._boundLoop);
    }

    clear() {
      this.running = false;
      this.canvas.style.transition = 'none';
      this.canvas.style.opacity = '0';
      this.ctx.clearRect(0, 0, this.w, this.h);
    }

    _loop(now) {
      if (!this.running) return;
      const elapsed = now - this.startTime;
      this._draw(elapsed);
      if (elapsed >= RISE_MS + SPIN_MS) {
        // Reveal fully drawn. Fade canvas out and hand off to DOM ball.
        this.running = false;
        this.onComplete && this.onComplete();
        requestAnimationFrame(() => {
          this.canvas.style.transition = 'opacity 0.35s ease';
          this.canvas.style.opacity = '0';
          setTimeout(() => {
            this.canvas.style.transition = 'none';
            this.ctx.clearRect(0, 0, this.w, this.h);
          }, 420);
        });
        return;
      }
      requestAnimationFrame(this._boundLoop);
    }

    _draw(elapsed) {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, this.w, this.h);

      if (elapsed < RISE_MS) {
        // Phase 1: rise + grow. Ball starts small below the panel bottom edge,
        // arcs up to center, growing along the way with an ease-in curve so
        // the "arrival" feels punchy.
        const t = elapsed / RISE_MS;
        const yEase = 1 - Math.pow(1 - t, 3);
        const scaleT = 0.15 + 0.85 * (t * t);
        const startY = this.h + this.ballRadius * 0.4;
        const y = startY - (startY - this.centerY) * yEase;
        this._drawBallFace(this.centerX, y, this.ballRadius * scaleT, 1);
      } else {
        // Phase 2: spin around the vertical axis. scaleX = cos(angle) collapses
        // the ball to edge-on at π/2, past which the number takes over.
        const t = (elapsed - RISE_MS) / SPIN_MS;
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const cosVal = Math.cos(eased * Math.PI);
        if (cosVal >= 0) {
          this._drawBallFace(this.centerX, this.centerY, this.ballRadius, cosVal);
        } else {
          this._drawNumberFace(this.centerX, this.centerY, -cosVal);
        }
      }
    }

    _drawBallFace(x, y, r, scaleX) {
      const ctx = this.ctx;
      if (scaleX <= 0.001 || r <= 0.5) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scaleX, 1);
      const grad = ctx.createRadialGradient(-r * 0.4, -r * 0.4, 0, 0, 0, r);
      grad.addColorStop(0.0, '#ffe598');
      grad.addColorStop(0.45, '#ffb000');
      grad.addColorStop(1.0, '#6a4200');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0a0a0a';
      ctx.lineWidth = Math.max(2, r * 0.06);
      ctx.stroke();
      ctx.restore();
    }

    _drawNumberFace(x, y, scaleX) {
      const ctx = this.ctx;
      if (scaleX <= 0.001) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scaleX, 1);
      ctx.font = `900 ${Math.round(this.numberFont)}px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Clean flat yellow — matches the settled DOM ball for a seamless handoff.
      ctx.fillStyle = '#ffb000';
      ctx.fillText(this.numberText, 0, 0);
      ctx.restore();
    }
  }

  const RISE_MS = 700;
  const SPIN_MS = 550;

  const mixer  = new BallMixer(mixerCanvas);
  const reveal = new RevealPanel(revealCanvas);

  // Kick off the mixer and pour the initial 75 balls in from above.
  requestAnimationFrame(() => {
    mixer.start();
    mixer.pourIn(TOTAL);
  });

  // ===== Cage spin sound (Web Audio) =====
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audioCtx = new Ctor();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function makeCageBuffer(ctx, dur) {
    const sr  = ctx.sampleRate;
    const len = Math.floor(dur * sr);
    const buf = ctx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * 0.18;
    const clicks = Math.floor(dur * 42);
    for (let c = 0; c < clicks; c++) {
      const start    = Math.floor(Math.random() * (len - 600));
      const clickLen = Math.floor((0.003 + Math.random() * 0.010) * sr);
      const amp      = 0.4 + Math.random() * 0.6;
      for (let i = 0; i < clickLen && start + i < len; i++) {
        const env = Math.exp(-i / (clickLen * 0.25));
        data[start + i] += (Math.random() * 2 - 1) * env * amp;
      }
    }
    for (let i = 0; i < len; i++) data[i] = Math.tanh(data[i] * 0.9);
    return buf;
  }

  // intensity ∈ [0,1]: scales both peak volume and playback rate so the sound
  // gets quieter and slower as fewer balls remain in the cage.
  function playCageSound(peakMs, tailMs, intensity) {
    const ctx = getAudio();
    if (!ctx) return;
    intensity = Math.max(0.12, Math.min(1, intensity));
    const volumeScale = 0.3 + 0.7 * intensity;
    const rateScale   = 0.7 + 0.3 * intensity;
    const peakDur  = peakMs / 1000;
    const tailDur  = tailMs / 1000;
    const totalDur = peakDur + tailDur;
    const fadeIn   = 0.01;
    const peak     = 0.45 * volumeScale;
    const now      = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = makeCageBuffer(ctx, totalDur + 0.2);

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2400;
    bp.Q.value = 0.6;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(peak,   now + fadeIn);
    g.gain.setValueAtTime(peak,                 now + peakDur);
    g.gain.exponentialRampToValueAtTime(0.0001, now + peakDur + tailDur);

    src.playbackRate.setValueAtTime(rateScale, now);
    src.playbackRate.setValueAtTime(rateScale, now + peakDur);
    src.playbackRate.linearRampToValueAtTime(rateScale * 0.5, now + peakDur + tailDur);

    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(now);
    src.stop(now + totalDur + 0.05);
  }

  // ===== Pull / Clear =====
  const REVEAL_MS  = RISE_MS + SPIN_MS;  // 1250ms of active reveal animation
  const SOUND_TAIL = 650;

  function pull() {
    if (mixing) return;
    if (drawn.size >= TOTAL) return;

    if (flashingNum !== null) {
      const prev = cellMap[flashingNum];
      prev.classList.remove('flashing');
      prev.classList.add('lit');
    }

    const pool = remainingNumbers();
    if (pool.length === 0) return;
    const next = pool[Math.floor(Math.random() * pool.length)];

    mixing = true;
    pullBtn.disabled = true;
    clearBtn.disabled = true;

    // Hide the DOM ball text so the reveal canvas isn't fighting with old content.
    ballEl.classList.remove('revealing');
    ballEl.classList.add('hidden');

    // Bottom panel: fade one ball out.
    mixer.removeBall();

    // Intensity based on balls that will be left after this pull.
    const intensity = mixer.liveCount() / TOTAL;
    playCageSound(REVEAL_MS, SOUND_TAIL, intensity);

    // Top panel: rise + spin. Handoff to the DOM ball element at the end.
    reveal.play(formatBall(next), () => {
      setBall(formatBall(next));
      ballEl.classList.remove('hidden');
      ballEl.classList.remove('revealing');
      void ballEl.offsetWidth;
      ballEl.classList.add('revealing');

      drawn.add(next);
      cellMap[next].classList.add('flashing');
      flashingNum = next;
      mixing = false;
      pullBtn.disabled  = drawn.size >= TOTAL;
      clearBtn.disabled = false;
      updateCount();
    });
  }

  function doClearAll() {
    if (mixing) return;
    drawn.clear();
    flashingNum = null;
    for (const cell of Object.values(cellMap)) {
      cell.classList.remove('lit', 'flashing');
    }
    setBall('--', true);
    ballEl.classList.remove('hidden', 'revealing');
    reveal.clear();
    // Pour in only the missing balls (so mid-game clears feel like a top-up).
    mixer.replenishTo(TOTAL);
    pullBtn.disabled = false;
    updateCount();
  }

  function openConfirm() {
    if (mixing) return;
    if (drawn.size === 0) { doClearAll(); return; }
    confirmCountEl.textContent = drawn.size;
    modalEl.classList.add('open');
    modalEl.setAttribute('aria-hidden', 'false');
    modalOpen = true;
  }

  function closeConfirm() {
    modalEl.classList.remove('open');
    modalEl.setAttribute('aria-hidden', 'true');
    modalOpen = false;
  }

  pullBtn.addEventListener('click', pull);
  clearBtn.addEventListener('click', openConfirm);

  confirmOkBtn.addEventListener('click', () => { closeConfirm(); doClearAll(); });
  confirmCancelBtn.addEventListener('click', closeConfirm);
  modalEl.addEventListener('click', (e) => { if (e.target === modalEl) closeConfirm(); });

  document.addEventListener('keydown', (e) => {
    if (modalOpen) {
      if (e.key === 'Escape')      { e.preventDefault(); closeConfirm(); }
      else if (e.key === 'Enter')  { e.preventDefault(); closeConfirm(); doClearAll(); }
      return;
    }
    if (e.target instanceof HTMLButtonElement) return;
    if (e.code === 'Space')              { e.preventDefault(); pull(); }
    else if (e.key.toLowerCase() === 'c') { openConfirm(); }
    else if (e.key.toLowerCase() === 'f') { toggleFullscreen(); }
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen && document.exitFullscreen();
  }
  fsBtn.addEventListener('click', toggleFullscreen);
</script>
</body>
</html>
